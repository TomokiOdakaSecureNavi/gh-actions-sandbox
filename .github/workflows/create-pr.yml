name: Create Pull Request

on:
  workflow_call:
    inputs:
      base_branch:
        description: 'Base branch for the pull request'
        required: true
        type: string
      head_branch:
        description: 'Head branch for the pull request'
        required: true
        type: string
      pr_title:
        description: 'Title of the pull request'
        required: false
        type: string
        default: 'Auto PR: Update {{base_branch}} from {{head_branch}}'
      pr_body:
        description: 'Body of the pull request'
        required: false
        type: string
        default: 'This PR was automatically created when {{head_branch}} branch was updated.'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Check if PR already exists
        id: check-pr
        run: |
          PR_EXISTS=$(gh pr list --repo ${{ github.repository }} --base ${{ inputs.base_branch }} --head ${{ inputs.head_branch }} --state open --json number --jq 'length')
          if [ "$PR_EXISTS" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "PR already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing PR found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for diff between branches
        id: check-diff
        if: steps.check-pr.outputs.exists == 'false'
        run: |
          ENCODED_BASE=$(jq -rn --arg v "$BASE_BRANCH" '$v|@uri')
          ENCODED_HEAD=$(jq -rn --arg v "$HEAD_BRANCH" '$v|@uri')
          DIFF_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/compare/${ENCODED_BASE}...${ENCODED_HEAD}" --jq '.total_commits')
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No commits between $BASE_BRANCH and $HEAD_BRANCH. Skipping PR creation."
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Found $DIFF_COUNT commit(s) between branches."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          HEAD_BRANCH: ${{ inputs.head_branch }}

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false' && steps.check-diff.outputs.has_diff == 'true'
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --base ${{ inputs.base_branch }} \
            --head ${{ inputs.head_branch }} \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_body }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
